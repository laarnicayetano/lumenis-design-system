<!-- @dsCard group="Components" viewport="700x330" name="Quote" subtitle="Attributed pull-quote" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Quote } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <Quote
        attribution="Evie Rose"
        role="Aesthetic Clinic, London"
        style={{ maxWidth: "42ch" }}
      >
        Lumenis products have been such a success in my clinic, achieving
        amazing results with my clients.
      </Quote>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
