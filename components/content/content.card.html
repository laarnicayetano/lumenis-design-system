<!-- @dsCard group="Components" viewport="700x330" name="Card Variants" subtitle="Content blocks from the corporate site" -->
<link rel="stylesheet" href="../../styles.css" />
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css"
/>
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css"
/>
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { ProductCard, InsightCard, Quote, StatBlock } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "150px 190px 1fr",
          gap: 22,
          alignItems: "start",
        }}
      >
        <ProductCard name="Stellar M22™" market="Aesthetics · IPL" />
        <InsightCard
          title="FoLix Named Best Laser Treatment for Hair Loss Two Years Running"
          topics={["FoLix", "News"]}
        />
        <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
          <Quote
            attribution="Evie Rose"
            role="Aesthetic Clinic, London"
            style={{ maxWidth: "32ch" }}
          >
            Lumenis products have been such a success in my clinic, achieving
            amazing results with my clients.
          </Quote>
          <div style={{ display: "flex", gap: 26 }}>
            <StatBlock value="88+" label="Countries" detail="Worldwide" />
            <StatBlock value="90k+" label="Devices" detail="Installed" />
            <StatBlock value="60+" label="Years" detail="Of leadership" />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
