<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>

<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--surface-page)"></div>
<script type="text/babel">
const { Card, StatBlock } = window[Object.keys(window).find(function (k) { return k.indexOf('LumenisDesignSystem') === 0; })];

function Demo() {
  return (
    <div style={{ display: "flex", gap: 22 }}>
      <Card style={{ flex: 1 }}>
        <StatBlock value="88+" label="Countries" detail="Worldwide" />
      </Card>
      <Card elevation="md" style={{ flex: 1 }}>Elevated / hover state</Card>
      <Card elevation="none" style={{ flex: 1 }}>Flat, no shadow</Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
