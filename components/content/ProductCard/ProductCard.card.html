<!-- @dsCard group="Components" viewport="700x560" name="ProductCard" subtitle="Product image, name, and market" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { ProductCard } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", gap: 22 }}>
        <ProductCard name="Stellar M22™" market="Aesthetics · IPL" style={{ width: 150 }} />
        <ProductCard name="OptiLIGHT" market="Vision · Dry eye" style={{ width: 150 }} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
