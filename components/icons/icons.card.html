<!-- @dsCard group="Components" viewport="700x200" name="Icons" subtitle="Substituted line set — small 1pt and large 2pt scale" -->
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--surface-page)"></div>
<script type="text/babel">
const { Icon, Eyebrow } = window[Object.keys(window).find(function (k) { return k.indexOf('LumenisDesignSystem') === 0; })];
const NAMES = [
  "eye",
  "sparkle",
  "user-circle",
  "heartbeat",
  "calendar-blank",
  "first-aid-kit",
  "hand-heart",
  "waveform",
];
const LARGE_NAMES = ["eye", "sparkle", "hand-heart", "waveform"];
function Demo() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", gap: 22, alignItems: "center" }}>
        {NAMES.map((n) => (
          <Icon key={n} name={n} />
        ))}
      </div>
      <div style={{ display: "flex", gap: 26, alignItems: "center" }}>
        {LARGE_NAMES.map((n) => (
          <Icon key={n} name={n} scale="large" size={64} />
        ))}
      </div>
      <Eyebrow style={{ color: "var(--text-muted)" }}>
        Phosphor Light / Thin — substitute for the unsupplied Lumenis icon set
      </Eyebrow>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
