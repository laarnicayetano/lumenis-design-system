<link rel="stylesheet" href="../../../styles.css" />
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css"
/>
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css"
/>
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 0px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { SiteHeader, Logotype } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];
  Logotype.assetBase = "../../../assets";
  const NAV = [
    { id: "aesthetics", label: "Aesthetics" },
    { id: "vision", label: "Vision" },
    { id: "resources", label: "Resources" },
    { id: "about", label: "About" },
    { id: "support", label: "Support" },
    { id: "contact", label: "Contact" },
  ];
  function Demo() {
    return (
      <div
        style={{
          transform: "scale(.55)",
          transformOrigin: "top left",
          width: "1272px",
        }}
      >
        <SiteHeader active="aesthetics" nav={NAV} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
