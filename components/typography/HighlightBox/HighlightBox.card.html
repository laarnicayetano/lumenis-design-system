<!-- @dsCard group="Components" viewport="700x200" name="HighlightBox" subtitle="Inline emphasis box, outlined or filled" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { HighlightBox } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ fontSize: 28, display: "flex", flexDirection: "column", gap: 18 }}>
        <span>
          Open yourself. <HighlightBox>Discover</HighlightBox> a new you.
        </span>
        <span>
          Filled: <HighlightBox filled>Discover</HighlightBox> a new you.
        </span>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
