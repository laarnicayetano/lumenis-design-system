<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Prose } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Prose size="small">
          Lumenis is a global leader in the field of minimally-invasive
          clinical solutions for Ophthalmology and Aesthetic markets.
        </Prose>
        <Prose size="subtitle" tone="var(--text-muted)">
          Subtitle size, muted tone.
        </Prose>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
