<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Button } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <style>{`
                .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
        .dark{background:var(--lum-black);padding:16px;margin-top:4px}
      `}</style>
        <div className="row">
          <Button>Discover more</Button>
          <Button variant="secondary">Download kit</Button>
          <Button size="sm">Read more</Button>
          <Button size="sm" variant="secondary" disabled>
            Unavailable
          </Button>
        </div>
        <div className="row dark">
          <Button variant="inverse">Discover more</Button>
          <Button variant="inverse-outline">Learn more</Button>
        </div>
        <div className="row" data-subbrand="optilight">
          <Button variant="accent">Book a demo</Button>
          <Button variant="accent-outline">Clinical studies</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
