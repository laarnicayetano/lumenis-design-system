<!-- @dsCard group="Components" viewport="700x260" name="Selection Controls" subtitle="Checkbox, radio, select &amp; switch" -->
<link rel="stylesheet" href="../../styles.css" />
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css"
/>
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css"
/>
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Checkbox, Radio, Select, Switch } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "1fr 1fr 1.2fr",
          gap: 24,
          alignItems: "start",
        }}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Checkbox label="Send clinical updates" checked readOnly />
          <Checkbox label="Unavailable option" disabled />
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Radio name="skinType" label="Type II" readOnly />
          <Radio name="skinType" label="Type III" checked readOnly />
          <Switch label="Enable OPT mode" checked />
        </div>
        <Select
          label="Practice type"
          placeholder="Choose one"
          options={["Dermatology", "Med spa", "Plastic surgery"]}
        />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
