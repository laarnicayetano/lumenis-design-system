<!-- @dsCard group="Components" viewport="700x300" name="TextField" subtitle="Underlined inputs, single-line and multiline" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { TextField } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 18, maxWidth: 360 }}>
        <TextField label="Full name" placeholder="Dr. Evie Rose" />
        <TextField
          label="Work email"
          type="email"
          required
          placeholder="you@clinic.com"
        />
        <TextField label="How can we help?" multiline rows={2} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
