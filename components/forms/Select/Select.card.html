<!-- @dsCard group="Components" viewport="700x260" name="Select" subtitle="Dropdown with label and placeholder" -->
<link rel="stylesheet" href="../../../styles.css" />
<link
  rel="stylesheet"
  href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css"
/>
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Select } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 18, maxWidth: 320 }}>
        <Select
          label="Practice type"
          placeholder="Choose one"
          options={["Dermatology", "Med spa", "Plastic surgery"]}
        />
        <Select
          label="Inverse"
          tone="inverse"
          placeholder="Choose one"
          options={["Dermatology", "Med spa"]}
          style={{ background: "var(--lum-black)", padding: 16 }}
        />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
