<!-- @dsCard group="Components" viewport="700x160" name="Badge" subtitle="Status label, neutral/accent/inverse" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 20px; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Badge } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <Badge>New</Badge>
          <Badge tone="accent">FDA cleared</Badge>
        </div>
        <div
          style={{
            background: "var(--lum-black)",
            padding: 16,
            display: "flex",
            gap: 10,
          }}
        >
          <Badge tone="inverse">Inverse</Badge>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
