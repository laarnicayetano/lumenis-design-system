<!-- @dsCard group="Components" viewport="700x280" name="Rays" subtitle="OptiLIGHT's signature graphic system — origin, tone, and text-clearing" -->
<link rel="stylesheet" href="../../../styles.css" />
<script
  src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  crossorigin
></script>
<script
  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  crossorigin
></script>
<script src="../../../_ds_bundle.js"></script>
<div id="root" style="padding: 0; background: var(--surface-page)"></div>
<script type="text/babel">
  const { Rays } =
    window[
      Object.keys(window).find(function (k) {
        return k.indexOf("LumenisDesignSystem") === 0;
      })
    ];

  function Tile({ children, dark }) {
    return (
      <div
        style={{
          position: "relative",
          overflow: "hidden",
          background: dark ? "var(--lum-black)" : "var(--surface-page)",
          height: 280,
        }}
      >
        {children}
      </div>
    );
  }

  function Demo() {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0 }}>
        <Tile dark>
          <Rays
            tone="blue"
            origin="bottom-left"
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}
          />
        </Tile>
        <Tile>
          <Rays
            tone="light"
            origin="right"
            clear="center"
            style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}
          />
        </Tile>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
