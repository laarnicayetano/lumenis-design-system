<!-- @dsCard group="Corporate website" viewport="1280x900" name="Corporate Website" subtitle="Home, product detail and contact — click-through" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumenis — Corporate website kit</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/thin/style.css"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="shared.jsx"></script>
    <script type="text/babel" src="Home.jsx"></script>
    <script type="text/babel" src="ProductDetail.jsx"></script>
    <script type="text/babel" src="Contact.jsx"></script>
    <script type="text/babel" data-presets="react">
      function App() {
        const [view, setView] = React.useState({ page: "home" });
        const go = (page) => setView({ page });
        return (
          <div>
            <SiteHeader
              nav={NAV}
              active={view.page === "home" ? "aesthetics" : view.page}
              onNavigate={(id) => go(id === "contact" ? "contact" : "home")}
            />
            {view.page === "contact" ? (
              <Contact />
            ) : view.page === "product" ? (
              <ProductDetail id={view.id} onBack={() => go("home")} />
            ) : (
              <Home
                onOpenProduct={(id) => setView({ page: "product", id })}
                onNavigate={go}
              />
            )}
            <SiteFooter
              columns={FOOTER_COLUMNS}
              social={[
                "facebook-logo",
                "instagram-logo",
                "linkedin-logo",
                "x-logo",
                "youtube-logo",
              ]}
              policies={[
                "Privacy Statement",
                "Terms of Use",
                "Safety Information",
                "Patents",
              ]}
            />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
