name: Tag version on merge

# Runs after a PR merges into master. The version bump itself already
# happened inside the PR (see .claude/skills/propose-change/SKILL.md step 5
# — it runs scripts/bump-version.mjs and commits the result as part of the
# PR, so reviewers see the version change in the diff). All this workflow
# does is read the merged PR's bump:* label and, if it's not "none", tag the
# merge commit with the version now sitting in .claude-plugin/plugin.json.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Determine bump level from PR labels
        id: level
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          level=""
          for l in patch minor major none; do
            if echo ",$LABELS," | grep -q ",bump:$l,"; then
              level="$l"
            fi
          done
          if [ -z "$level" ]; then
            echo "No bump:* label found — skipping tag."
            level="none"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Checkout master
        if: steps.level.outputs.level != 'none'
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Read version and tag
        if: steps.level.outputs.level != 'none'
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — skipping (was this PR's version bump actually committed?)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag — PR #${{ github.event.pull_request.number }} (${{ steps.level.outputs.level }})"
          git push origin "$tag"
