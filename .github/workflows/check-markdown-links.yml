name: Check markdown links

# Fails the PR if any markdown file links to a relative path that doesn't
# exist, or an external URL that's dead. Calls the reusable workflow from
# laarnicayetano/lumenis-repo-preflight (the shared CLI wrapping lychee)
# instead of reimplementing the install-and-run steps here.
#
# Pinned to v0.2.0, not the `v1` tag the preflight repo's own README
# documents — that tag doesn't exist yet there (latest release is 0.2.0,
# pre-1.0). Re-pin once a v1 moving tag actually exists.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "configs/lychee.toml"

jobs:
  check-links:
    uses: laarnicayetano/lumenis-repo-preflight/.github/workflows/check-links.yml@v0.2.0
    with:
      config: configs/lychee.toml
