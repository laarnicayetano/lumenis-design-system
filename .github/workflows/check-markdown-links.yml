name: Check markdown links

# Fails the PR if any markdown file links to a relative path that doesn't
# exist, or an external URL that's dead — via `preflight check-links`
# (lychee) against configs/lychee.toml. Catches renames/removals (like a
# deleted skill) that leave other docs pointing at nothing.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "configs/lychee.toml"
      - "package.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee
      - run: npm ci
      - run: npm run check:links
